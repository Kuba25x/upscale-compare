apply plugin: 'com.android.application'

def releaseVersion = new Properties()
rootProject.file('release.properties').withInputStream { releaseVersion.load(it) }
def releaseCode = releaseVersion.getProperty('versionCode', '')
def releaseName = releaseVersion.getProperty('versionName', '')
if (!(releaseCode ==~ /[1-9][0-9]{0,9}/) ||
        releaseCode.toLong() > 2100000000L ||
        !(releaseName ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?/)) {
    throw new GradleException('Invalid android/release.properties')
}

// Resolve the SDKs used by @Config with Gradle's Maven Central cache. Each SDK
// needs its own configuration because both versions use the same module name.
def robolectricSdkJars = [
    robolectricSdk28: '9-robolectric-4913185-2-i7',
    robolectricSdk33: '13-robolectric-9030017-i7',
].collect { configurationName, version ->
    def sdk = configurations.create(configurationName) {
        canBeConsumed = false
        transitive = false
    }
    dependencies.add(sdk.name, "org.robolectric:android-all-instrumented:${version}")
    sdk
}
def robolectricSdkDirectory = layout.buildDirectory.dir('robolectric-sdks')
def prepareRobolectricSdks = tasks.register('prepareRobolectricSdks', Sync) {
    from(robolectricSdkJars)
    into(robolectricSdkDirectory)
}

android {
    namespace = "io.github.kuba25x.upscalecompare"
    buildToolsVersion '35.0.0'
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.kuba25x.upscalecompare"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseCode.toInteger()
        versionName releaseName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            dependsOn prepareRobolectricSdks
            inputs.dir robolectricSdkDirectory
            systemProperty 'robolectric.dependency.dir', robolectricSdkDirectory.get().asFile.absolutePath
        }
    }
    // Instrumentation uses isolated app data and cannot overwrite a user's comparison.
    testBuildType 'systemUi'
    buildTypes {
        release {
            debuggable false
            // Production signing is performed offline, outside Gradle and CI.
            signingConfig null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        systemUi {
            initWith debug
            applicationIdSuffix '.systemuitest'
            matchingFallbacks = ['debug']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencyLocking { lockAllConfigurations() }

dependencies {
    implementation "androidx.activity:activity:$androidxActivityVersion"
    testImplementation 'org.robolectric:robolectric:4.16.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

apply from: rootProject.file('release-support.gradle')
