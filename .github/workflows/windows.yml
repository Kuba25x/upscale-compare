name: Windows native build
on:
  workflow_dispatch:
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  push:
    branches: [feat/windows-native-rust, main]
    paths: ['windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Ensure stable Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            windows/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run automated tests
        run: cargo test --locked
      - name: Build Windows release executable
        run: cargo build --release --locked
      - name: Record executable SHA-256
        shell: pwsh
        run: |
          $exe = Get-Item target/release/upscale-compare.exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $sizeMb = [Math]::Round($exe.Length / 1MB, 2)
          Write-Host "Built $($exe.Name) ($sizeMb MB) SHA-256: $hash"
          @(
            '### Windows Native Build'
            "- File: ``$($exe.Name)`` ($sizeMb MB)"
            "- SHA-256: ``$hash``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upscale-compare-windows-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: windows/target/release/upscale-compare.exe
          if-no-files-found: error
          retention-days: 14
