name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pwa-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_FIREFOX: 'true'
      RUN_WEBKIT: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify PWA build artifacts and Android isolation
        run: npm run test:pwa:build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/set-playwright-browser.mjs
      - name: Verify private offline shell and browser-managed updates
        run: npm run test:pwa
      - name: Verify installed Chromium standalone window and offline restart
        run: xvfb-run -a npm run test:pwa:install
      - name: Verify production sharing with an active worker
        run: npm run test:pwa:sharing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pwa-test-results-${{ github.run_attempt }}
          path: |
            playwright-report/pwa*/
            test-results/pwa*/
          retention-days: 7
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
      RUN_FIREFOX: 'true'
      RUN_WEBKIT: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Select Playwright Chromium
        run: node scripts/set-playwright-browser.mjs
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - name: Validate production sharing locally with verification doubles
        run: npm run test:sharing:local
      - name: Build and test frontend-only Pages demo
        run: npm run test:demo
      - name: Test opt-in local diagnostics
        run: npm run test:diagnostics
      - name: Audit dependencies with the reviewed advisory policy
        run: npm run audit:dependencies
      - name: Verify GitHub Pages repository subpath
        run: VITE_BASE_PATH=/upscale-compare/ npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-test-results-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            .wrangler/security-audit/
          retention-days: 7
