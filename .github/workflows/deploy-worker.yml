name: Deploy Cloudflare API
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to authorize production API deployment'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.confirmation == 'DEPLOY'
    environment: cloudflare-production
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Select Playwright Chromium
        run: node scripts/set-playwright-browser.mjs
      - run: npm run test:e2e
      - name: Prepare production configuration
        env:
          D1_ID: ${{ vars.CLOUDFLARE_D1_ID }}
          BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          APPROVED_PAID_CPU_MS: ${{ vars.APPROVED_PAID_CPU_MS }}
        run: node scripts/prepare-production.mjs
      - name: Apply schema and deploy with public uploads disabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply upscale-compare --remote --config worker/wrangler.production.json
          npx wrangler deploy --config worker/wrangler.production.json
