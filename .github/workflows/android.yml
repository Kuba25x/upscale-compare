name: Android debug APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      [
        'src/**',
        'shared/**',
        'android/**',
        'tests/**',
        'package*.json',
        '*config.ts',
        'scripts/android-*',
        '.github/workflows/android.yml',
      ]
  push:
    branches: [feat/android-capacitor, main]
    paths:
      [
        'src/**',
        'shared/**',
        'android/**',
        'tests/**',
        'package*.json',
        '*config.ts',
        'scripts/android-*',
        '.github/workflows/android.yml',
      ]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  system-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm install --global npm@11.9.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - name: Enable KVM access for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-system-ui-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-system-ui-reports-${{ github.sha }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            test-results/native-system-ui/
          retention-days: 14
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm install --global npm@11.9.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/set-playwright-browser.mjs
      - run: npm run test:android:web
      - run: npx vitest run tests/unit/demo-config.test.ts tests/unit/android-adapter.test.ts
      - run: npm run android:apk
      - name: Verify and describe APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/upscale-compare-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/upscale-compare-debug.apk
          sha256sum artifacts/upscale-compare-debug.apk | sed 's|artifacts/||' > artifacts/SHA256SUMS
          git rev-parse HEAD > artifacts/COMMIT
          printf '%s\n' 'Debug build; device qualification pending. See docs/ANDROID.md.' 'The disposable CI debug key may require uninstalling a previous build (which deletes its local session).' > artifacts/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: upscale-compare-debug-${{ github.sha }}
          path: artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports-${{ github.sha }}
          path: |
            android/app/build/reports/
            test-results/
          retention-days: 14
