name: Android debug APK
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      preview_tag:
        required: true
        type: string
    outputs:
      artifact_id:
        value: ${{ jobs.apk.outputs.artifact_id }}
      checksum_digest:
        value: ${{ jobs.apk.outputs.checksum_digest }}
  pull_request:
    paths:
      [
        'src/**',
        'shared/**',
        'android/**',
        'tests/**',
        'package*.json',
        '*config.ts',
        'index.html',
        'public/**',
        'scripts/android-*',
        'scripts/generate-notices.*',
        'scripts/pwa-build.ts',
        '.github/workflows/android.yml',
        '.github/workflows/android-preview.yml',
      ]
  push:
    branches: [feat/android-capacitor, main]
    paths:
      [
        'src/**',
        'shared/**',
        'android/**',
        'tests/**',
        'package*.json',
        '*config.ts',
        'index.html',
        'public/**',
        'scripts/android-*',
        'scripts/generate-notices.*',
        'scripts/pwa-build.ts',
        '.github/workflows/android.yml',
        '.github/workflows/android-preview.yml',
      ]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ inputs.preview_tag && 'preview' || 'debug' }}
  cancel-in-progress: true
jobs:
  system-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: ${{ inputs.preview_tag == '' && 'npm' || '' }}
      - run: npm install --global npm@11.9.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: ${{ inputs.preview_tag != '' }}
      - run: npm ci
      - run: npm run android:sync
      - name: Enable KVM access for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-system-ui-tests.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-system-ui-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            test-results/native-system-ui/
          retention-days: 14
  apk:
    outputs:
      artifact_id: ${{ steps.preview-artifact.outputs.artifact-id }}
      checksum_digest: ${{ steps.preview-bundle.outputs.checksum_digest }}
    env:
      PREVIEW_CANDIDATE: ${{ inputs.preview_tag != '' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: ${{ inputs.preview_tag == '' && 'npm' || '' }}
      - run: npm install --global npm@11.9.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: ${{ inputs.preview_tag != '' }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/set-playwright-browser.mjs
      - run: npm run test:android:web
      - run: npx vitest run tests/unit/demo-config.test.ts tests/unit/android-adapter.test.ts
      - run: npm run android:apk
        env:
          ORG_GRADLE_PROJECT_previewDistribution: ${{ env.PREVIEW_CANDIDATE }}
      - name: Test preview policies and prepare the distribution bundle
        if: env.PREVIEW_CANDIDATE == 'true'
        id: preview-bundle
        env:
          PREVIEW_TAG: ${{ inputs.preview_tag }}
        run: |
          node --test tests/release/android-preview*.test.mjs
          node_modules/.bin/prettier --check .github/workflows/android{,-preview}.yml scripts/android-preview*.mjs tests/release/android-preview*.test.mjs docs/ANDROID_PREVIEW.md
          node scripts/android-source-bundle.mjs release-artifacts/preview debug
          node scripts/android-preview-bundle.mjs release-artifacts/preview "$PREVIEW_TAG" "$GITHUB_SHA"
      - name: Store verified preview candidate
        if: env.PREVIEW_CANDIDATE == 'true'
        id: preview-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-preview-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifacts/preview/
          if-no-files-found: error
          retention-days: 14
      - name: Verify and describe APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/upscale-compare-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/upscale-compare-debug.apk
          sha256sum artifacts/upscale-compare-debug.apk | sed 's|artifacts/||' > artifacts/SHA256SUMS
          git rev-parse HEAD > artifacts/COMMIT
          printf '%s\n' 'Debug build; device qualification pending. See docs/ANDROID.md.' 'The disposable CI debug key may require uninstalling a previous build (which deletes its local session).' > artifacts/README.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upscale-compare-debug-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-test-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            android/app/build/reports/
            test-results/
          retention-days: 14
