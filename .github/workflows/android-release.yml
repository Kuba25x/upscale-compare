name: Android release preparation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'android/**'
      - 'tests/**'
      - 'package*.json'
      - '*config.ts'
      - 'scripts/android-*'
      - 'scripts/capture-readme.mjs'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Full reviewed main commit SHA (40 lowercase hex characters)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-release-preparation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select the exact reviewed main commit for a manual candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_COMMIT_INPUT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_COMMIT_INPUT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_COMMIT_INPUT" origin/main
          git checkout --detach "$SOURCE_COMMIT_INPUT"
      - name: Record exact build source
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm install --global npm@11.9.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: npm ci
      - name: Test release validation policy
        run: node --test tests/release/*.test.mjs
      - run: npm run android:sync
      - name: Build and lint an unsigned non-debuggable release
        working-directory: android
        run: ./gradlew --no-daemon lintRelease assembleRelease
      - name: Collect matching project and dependency source
        run: node scripts/android-source-bundle.mjs
      - name: Verify APK metadata, unsigned state, alignment, licenses and provenance
        run: node scripts/android-release.mjs prepare release-artifacts/unsigned
      - name: Test signing using a disposable key
        run: node scripts/android-release-smoke.mjs release-artifacts/unsigned
      - name: Capture authentic README screenshots
        run: |
          npx playwright install --with-deps chromium
          node scripts/capture-readme.mjs
      - name: Publish preparation artifact (not an installable signed release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upscale-compare-UNSIGNED-${{ env.SOURCE_COMMIT }}
          path: release-artifacts/unsigned/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-release-reports-${{ github.sha }}
          path: |
            android/app/build/reports/
            release-artifacts/screenshots/
          retention-days: 14

      - name: Check release preparation formatting and whitespace
        run: |
          npx prettier --check scripts/android-*.mjs scripts/capture-readme.mjs tests/release/*.mjs README.md docs/ANDROID*.md docs/DEVELOPMENT.md docs/SCREENSHOTS.md .github/workflows/android-release.yml package.json PROGRESS.md android/upstream-sources.json tests/shared/web-presentation.ts
          git diff --check


      - name: Diagnose formatting differences
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import prettier from 'prettier';
          import { readFileSync } from 'node:fs';
          for (const path of ["scripts/android-release.mjs","scripts/android-notices.mjs","scripts/android-source-bundle.mjs","tests/release/android-release.test.mjs","scripts/android-release-smoke.mjs",".github/workflows/android-release.yml","package.json","scripts/capture-readme.mjs","docs/ANDROID_RELEASE.md","README.md","docs/DEVELOPMENT.md","docs/SCREENSHOTS.md","docs/ANDROID.md","docs/ANDROID_RELEASE_VALIDATION.md","PROGRESS.md","android/upstream-sources.json","tests/shared/web-presentation.ts"]) {
            const input = readFileSync(path, 'utf8');
            const formatted = await prettier.format(input, { ...await prettier.resolveConfig(path), filepath: path });
            if (formatted !== input) {
              console.log('FORMAT_BEGIN ' + path);
              const data = Buffer.from(formatted).toString('base64');
              for (let n = 0; n < data.length; n += 4000) console.log('FORMAT_DATA ' + data.slice(n, n + 4000));
              console.log('FORMAT_END ' + path);
            }
          }
          NODE
